[project]
name = "tamilnyaya-bench-backend"
version = "0.1.0"
description = "TamilNyaya-Bench evaluation harness backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.1",
    "groq>=0.9.0",
    "openai>=1.30.0",          # OpenAI-compat endpoint fallback
    "httpx>=0.27.0",
    "rapidfuzz>=3.9.0",
    "pdfplumber>=0.11.0",
    "pytesseract>=0.3.13",
    "Pillow>=10.3.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.1",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
